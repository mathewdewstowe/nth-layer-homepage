<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page Not Found | The Nth Layer</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400..700&amp;family=Open+Sans:wght@400..700&amp;display=swap">
<style>
html,body{margin:0;background:#0d0f0d}
.nf{min-height:100vh;box-sizing:border-box;display:flex;align-items:center;justify-content:center;text-align:center;padding:40px 20px;color:#fff}
.nf .mark{width:56px;height:56px;color:#BFFF00;margin:0 auto 28px;display:block}
.nf .k{font:700 12px/1.4 "Inter Tight",Arial,sans-serif;letter-spacing:.1em;text-transform:uppercase;color:#BFFF00;margin:0 0 12px}
.nf h1{font:700 clamp(32px,5vw,52px)/1.1 "Inter Tight",Arial,sans-serif;letter-spacing:-.02em;margin:0 0 14px}
.nf p{font:400 17px/1.6 "Open Sans",Arial,sans-serif;color:rgba(255,255,255,.76);margin:0 0 28px}
.nf a{display:inline-block;background:#BFFF00;color:#0d0f0d;font:700 15px/1 "Inter Tight",Arial,sans-serif;padding:15px 24px;border-radius:999px;text-decoration:none}
</style>
</head>
<body>
<main class="nf"><div>
<svg class="mark" viewBox="0 0 80 80" fill="none" aria-hidden="true"><rect x="2" y="2" width="76" height="76" stroke="currentColor" stroke-width="4"/><rect x="14" y="14" width="52" height="52" stroke="currentColor" stroke-width="4"/><rect x="26" y="26" width="28" height="28" stroke="currentColor" stroke-width="4"/><rect x="35" y="35" width="10" height="10" fill="currentColor"/></svg>
<p class="k">Error 404</p>
<h1>Page Not Found</h1>
<p>The page you are looking for has moved or does not exist.</p>
<a href="/">Back to the Home Page</a>
</div></main>
</body>
</html>
