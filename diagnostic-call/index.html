<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>30-minute AI-Native SDLC Diagnostic | The Nth Layer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/diagnostic-call/call.css">
</head>
<body>
<header class="bar">
  <div class="brand">
    <svg viewBox="0 0 80 80" fill="none" aria-hidden="true"><rect x="2" y="2" width="76" height="76" stroke="currentColor" stroke-width="4"/><rect x="14" y="14" width="52" height="52" stroke="currentColor" stroke-width="4"/><rect x="26" y="26" width="28" height="28" stroke="currentColor" stroke-width="4"/><rect x="35" y="35" width="10" height="10" fill="currentColor"/></svg>
    <strong id="bar-co">New session</strong>
  </div>
  <div class="clocks">
    <p><span>Call</span> <b id="t-all">00:00</b></p>
    <p><span id="t-sec-name">Opening</span> <b id="t-sec">03:00</b></p>
    <button type="button" class="tiny" id="t-pause">Pause</button>
  </div>
  <ol class="dots" id="dots"></ol>
  <button type="button" class="tiny" id="rail-toggle" aria-pressed="true">Chart</button>
</header>
<div class="shell">
  <main id="step"></main>
  <aside id="rail"></aside>
</div>
<p id="status" class="status" hidden></p>
<script src="/diagnostic-call/model.js"></script>
<script src="/diagnostic-call/report.js"></script>
<script src="/diagnostic-call/call.js"></script>
</body>
</html>
